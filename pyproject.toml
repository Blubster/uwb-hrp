[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uwb-hrp"
version = "0.1.0"
description = "IEEE Std 802.15.4-2024 compliant HRP UWB PHY frame and baseband waveform generator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["uwb", "ieee-802.15.4", "hrp", "phy", "waveform", "dsp", "ranging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
rs = [
    "rswaveform>=0.5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uwb_hrp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["RsWaveform", "RsWaveform.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
