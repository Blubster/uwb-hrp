name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --all-extras --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests examples

      - name: Check formatting with ruff
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests examples

      - name: Type-check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy src tests examples

      - name: Run pytest with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=uwb_hrp --cov-report=term-missing

      - name: Smoke-test examples
        run: |
          for script in examples/*.py; do
            uv run --python ${{ matrix.python-version }} python "$script"
          done
